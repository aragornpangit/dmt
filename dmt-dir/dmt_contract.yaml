# dmt 结构契约（单一来源，机器可读）。
# 只放会漂移的结构性事实：技能、版本源、可选目录、操作手册、脚本和预算。
# 通用协作原则见 team.md；不使用固定措辞作为内容正确性的断言。

version: 5.19.7
date: "2026-11-07"

skills:
  dmt-dir: { run_id: dmt-dir,      kind: pane,  pane: true }
  dmt-dm:  { run_id: dmt-dm,       kind: pane,  pane: true }
  dmt-dl:  { run_id: "dmt-dl{n}",  kind: pane,  pane: true }
  dmt-am:  { run_id: dmt-am,         kind: pane,  pane: true }
  dmt-pde: { run_id: "dmt-pde{n}", kind: agent, pane: false }
  dmt-de:  { run_id: "dmt-de{n}",  kind: agent, pane: false }
  dmt-ae:  { run_id: "dmt-ae{n}",  kind: agent, pane: false }

version_sources:
  - dmt-dir/team.md
  - dmt-dir/SKILL.md
  - dmt-dm/SKILL.md
  - dmt-dl/SKILL.md
  - dmt-am/SKILL.md
  - dmt-pde/SKILL.md
  - dmt-de/SKILL.md
  - dmt-ae/SKILL.md

# 可选 DMT 目录不由通用安装强制。项目显式声明后，机检才验证其存在。
# artifact_dirs: []
# runtime_dirs: []

ops_docs:
  - runtime.md
  - comms.md
  - file-claim.md
  - helper.md
  - permission-notes.md
  - optional-skills.md

# 按 harness 加载的说明文件（一份共性 + 每 harness 一份差异）。
# 目录固定 dmt-dir/harness/；per_harness 的 harness 名集合必须与 harness_matrix.yaml 的 key 一致。
harness_docs:
  common: COMMON.md
  backlog: BACKLOG.md
  readme: README.md
  # pi 子代理 agent 定义模板（install-skills.sh 铺到 <target>/.pi/agents/）
  pi_agents_dir: pi-agents
  per_harness:
    - pi.md
    - codebuddy.md
    - claude.md
    - codex.md
    - opencode.md

skill_budgets:
  dmt-dir: 4500
  dmt-dm: 4000
  dmt-dl: 4000
  dmt-am: 4000
  dmt-pde: 3000
  dmt-de: 3000
  dmt-ae: 3000

scripts:
  - lib-dmt.sh
  - harness-matrix.sh
  - launch.sh
  - init-project.sh
  - setup-team.sh
  - dl-pane.sh
  - spawn-helper.sh
  - helper-report.sh
  - close-helper.sh
  - send-msg.sh
  - msg-take.sh
  - msg-done.sh
  - publish.sh
  - file-claim.sh
  - install-skills.sh
  - check-dmt.sh
  - bump-version.sh
  - archive-changelog.sh
  - digest-changelog.sh
  - install-git-hooks.sh
  - auto-review-model.sh
  - harness-detect.sh

# 仓级辅助脚本（不随安装分发；只存在于本仓库，供维护 / 一次性工具使用）
repo_scripts: [scripts/sync-mattpocock-codex-compat.sh]

forbidden_scripts: [probe-cap.sh, dispatch-ledger.sh, fanout.sh, install-hooks.sh]
