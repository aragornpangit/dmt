# dmt harness 兼容矩阵：单一来源。由 harness-matrix.sh 读取，供 lib-dmt.sh、
# setup-team.sh、spawn-helper.sh、install-skills.sh 与机检共用。改这里即改全部落点，
# 不要在脚本或文档里再写死某个 harness 的前缀 / 目录 / 启动参数。
#
# 字段：dir_project / dir_user / dir_project_extra 技能发现目录；slash_prefix 斜杠前缀；
# start_cmd 代启动命令；start_needs_trust 首次需人工 trust；max_subagents_conc 静态并发上限
# （null = 不设或运行时探测）；max_subagents_env / max_subagents_config 对应环境变量与配置键；
# skill_prefix 技能限定名前缀；subagent_skill 子代理加载角色技能方式（invoke / read / unknown）；
# first_prompt 启动是否接受首轮 prompt；tree_mode 会话树；doorbell 门铃检测名。
harnesses:
  codebuddy:
    skills:
      dir_project: .codebuddy/skills
      dir_user: .codebuddy/skills
    slash_prefix: "/"
    # --subagent-permission-mode bypassPermissions：否则 teammate/子代理可能回 default 档，逐条撞审批
    start_cmd: "bash '$DMT_SCRIPTS_DIR/auto-review-model.sh' --quiet; CODEBUDDY_AUTO_REVIEW_TIMEOUT_MS=300000 codebuddy --permission-mode auto --subagent-permission-mode bypassPermissions"
    max_subagents_conc: 8
    max_subagents_env: CODEBUDDY_CODE_MAX_CONCURRENT_SUBAGENTS
    max_subagents_config: null
    skill_prefix: null
    subagent_skill: invoke
    first_prompt: false
    tree_mode: full
    doorbell: codebuddy
  claude:
    skills:
      dir_project: .claude/skills
      dir_user: .claude/skills
    slash_prefix: "/"
    start_cmd: "claude --permission-mode auto"
    max_subagents_conc: 10
    max_subagents_env: CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS
    max_subagents_config: null
    skill_prefix: null
    subagent_skill: unknown
    first_prompt: false
    tree_mode: full
    doorbell: claude
  codex:
    skills:
      dir_project: .agents/skills
      dir_user: .agents/skills
      dir_project_extra: null
    slash_prefix: "/"
    # 默认保持受限沙箱；跨沙箱访问 herdr 需要用户显式授权，见 harness/codex.md。
    start_cmd: "codex -a never"
    max_subagents_conc: 8
    max_subagents_env: null
    max_subagents_config: "agents.max_concurrent_threads_per_session"
    skill_prefix: "mattpocock-skills:"
    subagent_skill: read
    first_prompt: true
    tree_mode: herdr
    doorbell: codex
  opencode:
    skills:
      dir_project: .agents/skills
      dir_user: .agents/skills
      dir_project_extra: .opencode/skills
    # 2026-11-06 用户裁定：opencode v2 用 @<skill-id> 显式引用技能（斜杠清单不全，/to-spec 等不生效）
    slash_prefix: "@"
    start_cmd: "opencode --auto"
    # 上游（opencode 2.2.5）未提供并发入口 ⇒ 显式声明为「不设」，派发前按任务规模自判
    max_subagents_conc: null
    max_subagents_env: null
    max_subagents_config: null
    skill_prefix: null
    subagent_skill: invoke
    first_prompt: false
    tree_mode: full
    doorbell: opencode
  pi:
    skills:
      dir_project: .agents/skills
      dir_user: .pi/agent/skills
      # 2026-11-06 实测 pi 实现（collectAncestorAgentsSkillDirs）：项目级只沿祖先链扫
      # `.agents/skills`，**不扫** `.pi/skills` ⇒ 该项目不再铺（铺了也不生效）。
      dir_project_extra: null
    # pane 角色用 /skill:<name>；子代理 delegate / 自定义 agent 无 Skill 工具，走 skills: 白名单 + read SKILL.md
    slash_prefix: "/skill:"
    start_cmd: "pi --approve"
    # pi-subagents 默认：workflow maxTasks=8 / concurrency=4（2026-11-06 实测文档）
    max_subagents_conc: 8
    max_subagents_env: null
    max_subagents_config: "workflow maxTasks=8 / concurrency=4（pi-subagents 默认，可按调用覆盖）"
    skill_prefix: null
    subagent_skill: read
    first_prompt: false
    tree_mode: full
    doorbell: pi

# harness 运行平台（harness-runtime-platform）：都不是 harness，是承载 harness 运行的环境；其中运行的仍是上面 harnesses 里的某个 agent CLI。
# 按职责分两段，成员各带 kind 标明所属层（供机检与脚本消费，不靠段名猜）：
#   runtimes: pane / 终端复用衬底        → kind: pane-runtime
#   ades:     编排层 / 控制面（ADE）      → kind: ade
# 两段都不进入 harnesses，也不参与 harness_docs.per_harness 的一一对应检查（check-dmt.sh A5/A6b）。
# 来源：herdr 本机在用；Orca 1.4.237 实测 2026-11-09；t3code 本机未实测，只登记定位、不编造命令。
runtimes:
  herdr:
    kind: pane-runtime
    status: in-use
    comms: "herdr CLI + unix socket；dmt_herdr_* 经 HERDR_SOCKET_PATH / HERDR_ENV 自愈"
    doorbell: "herdr agent prompt（cbc/codebuddy pane 改走 pane send-text + send-keys enter）"
    scripts_bound: "send-msg.sh / msg-done.sh / setup-team.sh / dl-pane.sh / lib-dmt.sh dmt_herdr_*"

ades:
  orca:
    kind: ade
    version_floor: "1.4.237"
    runtime_start_headless: "orca serve --no-pairing --json"
    runtime_start_desktop: "orca open --json"
    runtime_status: "orca status --json"
    unreachable_state: stale_bootstrap
    skills_discover: "orca skills installed --json"
    skills_bundled_guides: "orca skills list --json"
    skills_bundled_get: "orca skills get <topic>"
    skills_share: "orca skills share --skill <selector> --bundle-name <name>"
    skills_install: "install-skills.sh <worktree> --copy --harness all"
    repo_add: "orca repo add --path <path>"
    worktree_create: "orca worktree create --repo path:<path> --name <name> --setup skip --json"
    agent_launch: "orca agent launch --agent <id> --worktree path:<path> --surface terminal --json"
    first_prompt: false
    terminal_send: "orca terminal send --terminal <handle> --text <text> --enter --wait-submit 8"
    terminal_wait: "orca terminal wait --for tui-idle --timeout-ms <ms>"
    terminal_read: "orca terminal read --screen --terminal <handle>"
    terminal_close: "orca terminal close --terminal <handle>"
    orchestration_dispatch: "orca orchestration task-create|task-update|dispatch|worker-start"
    orchestration_report: "orca orchestration send|reply|inbox|ask"
    orchestration_wait: "orca orchestration worker-read|worker-stop|gate-*"
    orchestration_sender: "--from <own terminal handle> 或 ORCA_TERMINAL_HANDLE"
    doorbell: "orca terminal send + orchestration inbox"
    herdr_scripts: unavailable
    # 并发取 harnesses 上限与 Orca 当前容量的交集，不另设 ADE 独立上限
    max_subagents_conc: null
  t3code:
    kind: ade
    status: unverified
    # 本机 ~/pxy/tools/t3cmd/ 为空目录，未实测；命令、端口与配对方式待取证后登记，不编造
    note: "仅登记分层定位，不作为脚本派发依据"

# install-skills.sh --harness all 时铺设的落点（去重后的项目级目录）。
# 覆盖五个 harness：.agents/skills（codex/opencode/pi）+ .claude/skills（claude/opencode）+ .codebuddy/skills（codebuddy）。
# codex 同时发现 .codex/skills，但安装只用 .agents/skills，避免同一技能登记两次。
install_all_dirs:
  - .agents/skills
  - .claude/skills
  - .codebuddy/skills
