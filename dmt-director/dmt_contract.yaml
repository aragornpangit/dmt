# dmt 结构契约（单一来源，机器可读）。
# 只放「会漂移的结构性事实」：技能清单、版本源、产物目录、操作手册、脚本清单、技能预算。
# 散文纪律由 team.md 承载；内容断言（require / forbid 短句）见 dmt_assertions.yaml。
# 由 dmt-director/scripts/check-dmt.sh 校验。加改结构只改本文件，不改脚本。

version: 5.19.4
date: "2026-11-07"

skills:
  dmt-director: { run_id: director,      kind: pane,  pane: true }
  dmt-dm:       { run_id: devm,          kind: pane,  pane: true }
  dmt-devl:     { run_id: "devl{n}",     kind: pane,  pane: true }
  dmt-am:       { run_id: anam,          kind: pane,  pane: true }
  dmt-pde:      { run_id: "pde{n}",      kind: agent, pane: false }
  dmt-de:       { run_id: "dev-e",       kind: agent, pane: false }
  dmt-ae:       { run_id: "ana-e",       kind: agent, pane: false }
  dmt-reviewer: { run_id: "reviewer{n}", kind: agent, pane: false }

version_sources:
  - dmt-director/team.md
  - dmt-director/SKILL.md
  - dmt-dm/SKILL.md
  - dmt-devl/SKILL.md
  - dmt-am/SKILL.md
  - dmt-pde/SKILL.md
  - dmt-de/SKILL.md
  - dmt-ae/SKILL.md
  - dmt-reviewer/SKILL.md

artifact_dirs:
  - docs/pd/prd
  - docs/pd/spec
  - docs/dev/tickets
  - docs/analyst
  - docs/human/human-arch
  - docs/human/human-plan

runtime_dirs: [inbox]

ops_docs:
  - runtime.md
  - comms.md
  - file-claim.md
  - helper.md
  - permission-notes.md

# 按 harness 加载的说明文件（一份共性 + 每 harness 一份差异）。
# 目录固定 dmt-director/harness/；per_harness 的 harness 名集合必须与 harness_matrix.yaml 的 key 一致。
harness_docs:
  common: COMMON.md
  backlog: BACKLOG.md
  readme: README.md
  # pi 子代理 agent 定义模板（install-skills.sh 铺到 <target>/.pi/agents/）
  pi_agents_dir: pi-agents
  per_harness:
    - pi.md
    - codebuddy.md
    - claude.md
    - codex.md
    - opencode.md

skill_budgets:
  dmt-director: 4500
  dmt-dm: 4000
  dmt-devl: 4000
  dmt-am: 4000
  dmt-pde: 3000
  dmt-de: 3000
  dmt-ae: 3000
  dmt-reviewer: 3500

scripts:
  - lib-dmt.sh
  - harness-matrix.sh
  - launch.sh
  - init-project.sh
  - setup-team.sh
  - devl-pane.sh
  - spawn-helper.sh
  - helper-report.sh
  - close-helper.sh
  - send-msg.sh
  - msg-take.sh
  - msg-done.sh
  - publish.sh
  - file-claim.sh
  - install-skills.sh
  - check-dmt.sh
  - bump-version.sh
  - archive-changelog.sh
  - digest-changelog.sh
  - install-git-hooks.sh
  - auto-review-model.sh
  - harness-detect.sh

# 仓级辅助脚本（不随安装分发；只存在于本仓库，供维护 / 一次性工具使用）
repo_scripts: [scripts/sync-mattpocock-codex-compat.sh]

forbidden_scripts: [probe-cap.sh, dispatch-ledger.sh, fanout.sh, install-hooks.sh]
