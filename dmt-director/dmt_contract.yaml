# dmt 结构契约：单一来源（机器可读）。
#
# 这里放「会漂移的结构性事实」——技能清单、角色层级、产物目录、版本号位置、脚本清单。
# 由 dmt-director/scripts/check-dmt-structure.sh 校验，取代原先散落在
# check-dmt-doc-paths.sh 里的大段中文 grep（改一个字就红、复述就绿的脆断言）。
# 散文纪律（流程、话术）仍由 team.md 承载，这里只放可机读的结构。

version: 5.16.13
date: "2026-11-04"

skills:
  dmt-director: { run_id: director,      kind: pane,  pane: true }
  dmt-dm:       { run_id: devm,          kind: pane,  pane: true }
  dmt-am:       { run_id: anam,          kind: pane,  pane: true }
  dmt-pde:      { run_id: "pde{n}",      kind: agent, pane: false }
  dmt-de:       { run_id: "dev-e",       kind: agent, pane: false }
  dmt-ae:       { run_id: "ana-e",       kind: agent, pane: false }
  dmt-reviewer: { run_id: "reviewer{n}", kind: agent, pane: false }

version_sources:
  - dmt-director/team.md
  - dmt-director/SKILL.md
  - dmt-dm/SKILL.md
  - dmt-am/SKILL.md
  - dmt-pde/SKILL.md
  - dmt-de/SKILL.md
  - dmt-ae/SKILL.md
  - dmt-reviewer/SKILL.md

artifact_dirs:
  - docs/pd/prd
  - docs/pd/spec
  - docs/dev/tickets
  - docs/analyst
  - docs/human/human-arch
  - docs/human/human-plan
runtime_dirs:
  - inbox

org:
  director:
    reports_to: user
    direct_reports: [devm, anam]
  devm:
    reports_to: director
    direct_reports: ["dev-e", "reviewer{n}"]
  anam:
    reports_to: director
    direct_reports: ["ana-e"]

scripts:
  - lib-dmt.sh
  - harness-matrix.sh
  - launch.sh
  - init-project.sh
  - setup-team.sh
  - spawn-helper.sh
  - helper-report.sh
  - close-helper.sh
  - send-msg.sh
  - msg-take.sh
  - msg-done.sh
  - publish.sh
  - file-claim.sh
  - install-skills.sh
  - check-dmt-doc-paths.sh
  - check-dmt-structure.sh
  - bump-version.sh
  - archive-changelog.sh
  - install-git-hooks.sh
  - auto-review-model.sh

forbidden_scripts:
  - probe-cap.sh
  - dispatch-ledger.sh
  - fanout.sh
  - install-hooks.sh
